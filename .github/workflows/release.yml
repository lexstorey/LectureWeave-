name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 0.2.0"
        required: true
        default: "0.3.3"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Determine version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          "LECTUREWEAVE_VERSION=$version" >> $env:GITHUB_ENV
          "LECTUREWEAVE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run source self-test
        run: |
          python lecture_transcript_gui_qt.py --self-test
          python -m unittest discover -s tests

      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean LectureWeavePlus.spec

      - name: Remove conflicting ICU libraries if present
        shell: pwsh
        run: |
          $root = "dist\LectureWeavePlus"
          Get-ChildItem -LiteralPath $root -Recurse -File |
            Where-Object { $_.Name -in @("icuuc.dll", "icudt78.dll") } |
            Remove-Item -Force

      - name: Test packaged application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\LectureWeavePlus\LectureWeavePlus.exe" -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }

      - name: Add portable documentation
        shell: pwsh
        run: |
          Copy-Item README.md,LICENSE,THIRD_PARTY_NOTICES.txt -Destination "dist\LectureWeavePlus"
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive -LiteralPath "dist\LectureWeavePlus" -DestinationPath "release\LectureWeavePlus-Portable.zip" -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$env:LECTUREWEAVE_VERSION" "installer\LectureWeavePlus.iss"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash -Algorithm SHA256 "release\LectureWeavePlus-Setup.exe","release\LectureWeavePlus-Portable.zip" |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii "release\SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release\LectureWeavePlus-Setup.exe",
            "release\LectureWeavePlus-Portable.zip",
            "release\SHA256SUMS.txt"
          )
          if (gh release view $env:LECTUREWEAVE_TAG 2>$null) {
            gh release upload $env:LECTUREWEAVE_TAG @assets --clobber
          } else {
            gh release create $env:LECTUREWEAVE_TAG @assets --generate-notes --title "LectureWeave+ $env:LECTUREWEAVE_VERSION"
          }

